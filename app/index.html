<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rome corridor editor — road safety proposals in 3D</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%238c3b23'/%3E%3Crect x='7' y='2' width='2' height='12' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="vendor/cesium/Widgets/widgets.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <!-- Left: project, corridor, cross-section -->
    <aside class="panel panel--left">
      <header class="panel-head">
        <input id="projectName" class="project-name" aria-label="Project name" />
        <p id="contextStatus" class="status">—</p>
      </header>

      <section class="block">
        <h2>Corridor</h2>
        <p id="corridorInfo" class="muted">No corridor yet.</p>
        <button id="drawAxis" type="button" class="btn btn--primary">Draw corridor axis</button>
        <div class="prop-grid" id="corridorFields" hidden>
          <label class="prop-label" for="treatedFrom">Treated from (m)</label>
          <input id="treatedFrom" type="number" step="1" min="0" />
          <label class="prop-label" for="treatedTo">Treated to (m)</label>
          <input id="treatedTo" type="number" step="1" min="0" />
          <label class="prop-label" for="zoneHalfWidth">Zone half-width (m)</label>
          <input id="zoneHalfWidth" type="number" step="1" min="2" />
        </div>
      </section>

      <section class="block" id="sectionBlock" hidden>
        <h2>Cross-section</h2>
        <div class="seg" role="tablist" aria-label="Which cross-section to edit">
          <button id="tabExisting" type="button" role="tab" class="seg-btn">Existing</button>
          <button id="tabProposed" type="button" role="tab" class="seg-btn seg-btn--on">Proposed</button>
        </div>
        <div id="sectionEditor"></div>
        <button id="copySection" type="button" class="btn btn--small">Copy existing to proposed</button>
      </section>

      <section class="block">
        <h2>Project</h2>
        <div class="btn-row">
          <button id="saveProject" type="button" class="btn btn--small">Export</button>
          <button id="openProject" type="button" class="btn btn--small">Open</button>
        </div>
        <div class="btn-row">
          <button id="exportGeoJson" type="button" class="btn btn--small">GeoJSON</button>
          <button id="exportCsv" type="button" class="btn btn--small">CSV</button>
        </div>
        <button id="newProject" type="button" class="btn btn--small btn--quiet">Start over</button>
        <input id="fileInput" type="file" accept="application/json,.json" hidden />
      </section>
    </aside>

    <!-- Right: view controls, palette, properties -->
    <aside class="panel panel--right">
      <section class="block">
        <button id="modeToggle" type="button" class="btn btn--primary">Showing: proposed</button>
        <p class="hint">Hold <kbd>E</kbd> to peek at the existing layout.</p>
        <div class="btn-row">
          <button id="daylightToggle" type="button" class="btn">Daylight</button>
          <button id="contextToggle" type="button" class="btn">Context: on</button>
        </div>
        <button id="resetView" type="button" class="btn">Frame corridor</button>
      </section>

      <section class="block">
        <h2>Add element</h2>
        <div id="palette" class="palette"></div>
      </section>

      <section class="block">
        <h2>Properties</h2>
        <div id="properties"></div>
      </section>
    </aside>

    <section class="panel panel--summary" aria-label="What changes">
      <h2>What changes</h2>
      <table>
        <thead>
          <tr><th scope="col">Item</th><th scope="col">Existing</th><th scope="col">Proposed</th></tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </section>

    <footer class="panel panel--readout">
      <span class="readout-label">Cursor</span>
      <span id="readout">—</span>
    </footer>

    <div id="prompt" class="prompt" hidden></div>
    <div id="fatal" class="fatal" hidden></div>

    <script>
      window.CESIUM_BASE_URL = "vendor/cesium/";
    </script>
    <script src="vendor/cesium/Cesium.js"></script>
    <script type="module">
      // The modules are imported dynamically so that a missing CesiumJS is reported
      // here, in terms of what to do about it, rather than as an undefined-property
      // error thrown deep inside the first module that touches it.
      const fatal = document.getElementById("fatal");

      const fail = (heading, detail) => {
        fatal.hidden = false;
        fatal.innerHTML = "";
        const h = document.createElement("strong");
        h.textContent = heading;
        const p = document.createElement("p");
        p.innerHTML = detail;
        fatal.append(h, p);
        document.body.dataset.ready = "error";
      };

      if (!window.Cesium) {
        fail(
          "CesiumJS is not in this folder.",
          "The library is not committed to the repository, so a fresh clone does not have it. " +
            "In the folder you are serving, run:<code>python tools/setup_cesium.py</code>" +
            "then reload. If you have more than one copy of the project, make sure the server " +
            "is started from the same one you ran that in.",
        );
      } else {
        try {
          const { settings } = await import("./src/config.js");
          const { start } = await import("./src/app.js");
          await start(settings);
        } catch (error) {
          console.error(error);
          fail("Failed to start.", String(error?.message ?? error));
        }
      }
    </script>
  </body>
</html>
